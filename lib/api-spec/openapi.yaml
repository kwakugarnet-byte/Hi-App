openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Bar Order Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Order batch operations
  - name: menu
    description: Menu item operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /staff:
    get:
      tags: [Auth]
      operationId: getStaff
      summary: Get list of all staff members (names only, no PINs)
      responses:
        "200":
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"

  /pin-login:
    post:
      tags: [Auth]
      operationId: pinLogin
      summary: Log in with a staff PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinLoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
        "401":
          description: Invalid PIN

  /pin-logout:
    post:
      tags: [Auth]
      operationId: pinLogout
      summary: Log out the current staff session
      responses:
        "200":
          description: Logged out successfully

  /menu-items:
    get:
      operationId: getMenuItems
      tags: [menu]
      summary: Get all menu items
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"

  /order-batches:
    get:
      operationId: getOrderBatches
      tags: [orders]
      summary: Get all order batches
      responses:
        "200":
          description: List of order batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderBatch"
    post:
      operationId: createOrderBatch
      tags: [orders]
      summary: Create a new order batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBatchBody"
      responses:
        "201":
          description: Order batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBatch"

  /order-batches/{id}/complete:
    post:
      operationId: completeOrderBatch
      tags: [orders]
      summary: Mark an order batch as served (drinks ready)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order batch marked as served
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBatch"

  /order-batches/{id}/pay:
    post:
      operationId: payOrderBatch
      tags: [orders]
      summary: Mark an order batch as paid and clear it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order batch marked as paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBatch"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    StaffMember:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    PinLoginBody:
      type: object
      required: [staffId, pin]
      properties:
        staffId:
          type: integer
        pin:
          type: string
          minLength: 4
          maxLength: 4

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'

    MenuItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        pricePence:
          type: integer
      required:
        - id
        - name
        - category
        - pricePence

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        menuItemId:
          type: integer
        menuItemName:
          type: string
        quantity:
          type: integer
        pricePence:
          type: integer
      required:
        - id
        - menuItemId
        - menuItemName
        - quantity
        - pricePence

    OrderBatch:
      type: object
      properties:
        id:
          type: integer
        customerName:
          type: string
        waitressName:
          type: string
        createdAt:
          type: string
        completedAt:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, completed, paid]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
      required:
        - id
        - customerName
        - waitressName
        - createdAt
        - status
        - items

    CreateOrderItemBody:
      type: object
      properties:
        menuItemId:
          type: integer
        quantity:
          type: integer
      required:
        - menuItemId
        - quantity

    CreateOrderBatchBody:
      type: object
      properties:
        customerName:
          type: string
        waitressName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateOrderItemBody"
      required:
        - customerName
        - waitressName
        - items
