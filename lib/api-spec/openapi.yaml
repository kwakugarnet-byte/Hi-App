openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Bar Order Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Order batch operations
  - name: menu
    description: Menu item operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /staff:
    get:
      tags: [Auth]
      operationId: getStaff
      summary: Get list of all staff members (names only, no PINs)
      responses:
        "200":
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"

  /pin-login:
    post:
      tags: [Auth]
      operationId: pinLogin
      summary: Log in with a staff PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinLoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
        "401":
          description: Invalid PIN

  /pin-logout:
    post:
      tags: [Auth]
      operationId: pinLogout
      summary: Log out the current staff session
      responses:
        "200":
          description: Logged out successfully

  /change-pin:
    post:
      tags: [Auth]
      operationId: changePin
      summary: Change the current user's PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePinBody'
      responses:
        "200":
          description: PIN changed successfully
        "401":
          description: Not authenticated

  /admin/staff:
    get:
      tags: [Admin]
      operationId: getAdminStaff
      summary: List all staff members with roles (admin only)
      responses:
        "200":
          description: List of all staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminStaffMember'
    post:
      tags: [Admin]
      operationId: createStaff
      summary: Create a new staff member (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffBody'
      responses:
        "201":
          description: Staff member created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStaffMember'

  /admin/staff/{id}:
    patch:
      tags: [Admin]
      operationId: updateStaff
      summary: Update a staff member (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffBody'
      responses:
        "200":
          description: Staff member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStaffMember'
        "404":
          description: Not found
    delete:
      tags: [Admin]
      operationId: deleteStaff
      summary: Delete a staff member (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /menu-items:
    get:
      operationId: getMenuItems
      tags: [menu]
      summary: Get all menu items
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      operationId: createMenuItem
      tags: [menu]
      summary: Create a new menu item (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemBody"
      responses:
        "201":
          description: Menu item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"

  /menu-items/{id}:
    patch:
      operationId: updateMenuItem
      tags: [menu]
      summary: Update a menu item (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemBody"
      responses:
        "200":
          description: Menu item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
    delete:
      operationId: deleteMenuItem
      tags: [menu]
      summary: Delete a menu item (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted successfully

  /order-batches:
    get:
      operationId: getOrderBatches
      tags: [orders]
      summary: Get all order batches
      responses:
        "200":
          description: List of order batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderBatch"
    post:
      operationId: createOrderBatch
      tags: [orders]
      summary: Create a new order batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBatchBody"
      responses:
        "201":
          description: Order batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBatch"

  /order-batches/direct:
    post:
      operationId: createDirectSale
      tags: [orders]
      summary: Create a sale directly as completed (bartender/admin, no bar display needed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBatchBody"
      responses:
        "201":
          description: Direct sale created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBatch"

  /order-batches/{id}/edit:
    put:
      operationId: editOrderBatch
      tags: [orders]
      summary: Edit items in an existing order batch (bartender/admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditOrderBatchBody"
      responses:
        "200":
          description: Batch updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBatch"
        "404":
          description: Not found

  /order-batches/settle-waiter:
    post:
      operationId: settleWaiterAccount
      tags: [orders]
      summary: Settle all outstanding bills for a specific waiter (bulk mark paid)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettleWaiterBody"
      responses:
        "200":
          description: Account settled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettleWaiterResult"

  /order-batches/{id}/return:
    post:
      operationId: returnOrderBatch
      tags: [orders]
      summary: Return a batch to the waitress for correction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Batch returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBatch"

  /order-batches/{id}/resubmit:
    post:
      operationId: resubmitOrderBatch
      tags: [orders]
      summary: Resubmit a returned batch with corrected items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResubmitOrderBatchBody"
      responses:
        "200":
          description: Batch resubmitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBatch"

  /order-batches/{id}/complete:
    post:
      operationId: completeOrderBatch
      tags: [orders]
      summary: Mark an order batch as served (drinks ready)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order batch marked as served
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBatch"

  /shifts/me:
    get:
      operationId: getMyShift
      tags: [shifts]
      summary: Get the current user's active shift (null if none started today)
      responses:
        "200":
          description: Current shift status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftEnvelope"

  /shifts/start:
    post:
      operationId: startShift
      tags: [shifts]
      summary: Clock in — start the work day
      responses:
        "201":
          description: Shift started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "409":
          description: Shift already active

  /shifts/end:
    post:
      operationId: endShift
      tags: [shifts]
      summary: Clock out — end the work day
      responses:
        "200":
          description: Shift ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "404":
          description: No active shift found

  /shifts:
    get:
      operationId: getShifts
      tags: [shifts]
      summary: Get all shifts (admin sees all, others see own)
      parameters:
        - name: date
          in: query
          required: false
          description: Filter by date (YYYY-MM-DD). Defaults to today.
          schema:
            type: string
      responses:
        "200":
          description: List of shifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shift"

  /order-batches/{id}/pay:
    post:
      operationId: payOrderBatch
      tags: [orders]
      summary: Mark an order batch as paid and clear it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order batch marked as paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBatch"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    StaffRole:
      type: string
      enum: [admin, waitress, bartender]

    StaffMember:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    AdminStaffMember:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          $ref: '#/components/schemas/StaffRole'

    CreateStaffBody:
      type: object
      required: [name, role, pin]
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/StaffRole'
        pin:
          type: string
          minLength: 4
          maxLength: 4

    UpdateStaffBody:
      type: object
      properties:
        name:
          type: string
        role:
          $ref: '#/components/schemas/StaffRole'
        pin:
          type: string
          minLength: 4
          maxLength: 4

    ChangePinBody:
      type: object
      required: [newPin]
      properties:
        newPin:
          type: string
          minLength: 4
          maxLength: 4

    PinLoginBody:
      type: object
      required: [staffId, pin]
      properties:
        staffId:
          type: integer
        pin:
          type: string
          minLength: 4
          maxLength: 4

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        role:
          $ref: '#/components/schemas/StaffRole'
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'

    MenuItemBody:
      type: object
      required: [name, category, pricePence]
      properties:
        name:
          type: string
        category:
          type: string
        pricePence:
          type: integer
          minimum: 0

    MenuItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        pricePence:
          type: integer
      required:
        - id
        - name
        - category
        - pricePence

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        menuItemId:
          type: integer
        menuItemName:
          type: string
        quantity:
          type: integer
        pricePence:
          type: integer
      required:
        - id
        - menuItemId
        - menuItemName
        - quantity
        - pricePence

    OrderBatch:
      type: object
      properties:
        id:
          type: integer
        customerName:
          type: string
        waitressName:
          type: string
        createdAt:
          type: string
        completedAt:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, completed, paid]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
      required:
        - id
        - customerName
        - waitressName
        - createdAt
        - status
        - items

    CreateOrderItemBody:
      type: object
      properties:
        menuItemId:
          type: integer
        quantity:
          type: integer
      required:
        - menuItemId
        - quantity

    CreateOrderBatchBody:
      type: object
      properties:
        customerName:
          type: string
        waitressName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateOrderItemBody"
      required:
        - customerName
        - waitressName
        - items

    Shift:
      type: object
      required: [id, staffId, staffName, startedAt]
      properties:
        id:
          type: integer
        staffId:
          type: integer
        staffName:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true

    ShiftEnvelope:
      type: object
      required: [shift]
      properties:
        shift:
          oneOf:
            - $ref: "#/components/schemas/Shift"
            - type: "null"

    ResubmitOrderBatchBody:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateOrderItemBody"

    EditOrderBatchBody:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreateOrderItemBody"

    SettleWaiterBody:
      type: object
      required: [waitressName]
      properties:
        waitressName:
          type: string

    SettleWaiterResult:
      type: object
      required: [waitressName, count, totalPence]
      properties:
        waitressName:
          type: string
        count:
          type: integer
        totalPence:
          type: integer
